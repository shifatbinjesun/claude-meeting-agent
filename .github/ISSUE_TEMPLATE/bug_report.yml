name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: "What you did, what you expected, what you saw."}
    validations: {required: true}
  - type: dropdown
    id: platform
    attributes: {label: Meeting platform, options: [Google Meet, Zoom, Not meeting-related]}
  - type: input
    id: version
    attributes: {label: Claumeet version, placeholder: "e.g. 0.3.0 (Control Center → Overview, or `claumeet version`)"}
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Run Doctor-Claumeet.cmd and paste the result. Remove anything private. Never paste your API key.
      render: text
