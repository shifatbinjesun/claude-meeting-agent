name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (Windows, hash-pinned lock)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-windows.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest==9.2.0 pytest-asyncio==1.5.0 ruff==0.17.6
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Playwright Chromium (for browser tests)
        run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - name: Playwright Chromium (Windows)
        run: python -m playwright install chromium
        if: runner.os == 'Windows'
      - name: Lint
        run: ruff check src tests --select E,F,W,B --ignore E501,B008,E702
      - name: Tests
        run: python -m pytest -q
      - name: Doctor (smoke)
        run: python -m claude_agent doctor
        continue-on-error: true
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
            else { Write-Host "OK $($_.Name)" }
          }
          exit $bad
