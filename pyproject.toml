[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-meet-agent"
version = "0.1.0"
description = "Open-source, openly identified Bangladeshi AI participant for Google Meet with a local Control Center. Free-tier only, consent-first."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "google-genai==3.6.1",
  "playwright==1.65.2",
  "fastapi==0.165.0",
  "uvicorn==0.38.0",
  "pyyaml==6.0.4",
  "numpy>=2.1,<3",
  "psutil==7.2.2",
  "keyring==25.7.0",
  "httpx==0.28.1",
  "python-multipart==0.0.34",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.6", "pip-audit"]
# Experimental, unofficial TTS. OFF by default; see docs/RESEARCH.md before enabling.
edge = ["edge-tts==7.3.1"]

[project.scripts]
claude-agent = "claude_agent.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_agent = ["meet/*.js", "dashboard/static/*", "data/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
